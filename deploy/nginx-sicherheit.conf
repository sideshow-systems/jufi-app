# Sicherheits-Header, per include in jedem location-Block mit eigenem add_header
# (add_header vererbt sich dorthin nicht).
#
# CSP: Skripte nur vom eigenen Ursprung. Stile brauchen 'unsafe-inline', weil
# Angular die Bauteil-Stile als <style> einsetzt; eine Nonce ginge nur mit
# einem Server, der sie je Anfrage erzeugt. Das kritische CSS ist im Bau
# abgeschaltet (inlineCritical: false): es laedt das Stylesheet ueber ein
# onload-Attribut, das script-src 'self' sperren wuerde — verworfen wurde,
# dessen Hash mit 'unsafe-hashes' freizugeben, weil ein falscher Hash die Seite
# ungestylt liesse. WhatsApp und Google Maps sind Navigationen, keine Abrufe.
# img-src erlaubt blob: fuer die Vorschau gewaehlter Bilder vor dem Hochladen; die App
# sendet dieselbe Richtlinie (apps/jufi/src/server/sicherheit.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Fuer Browser ohne frame-ancestors.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
