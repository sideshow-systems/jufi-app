# Dienste der echten App (Teilprojekt 2) fuer die gemeinsame Compose-Datei auf
# dem Server. Muster: ../hwyd/deploy/hwyd-services.yml.
#
# ACHTUNG: YAML verbietet Tabs zur Einrueckung. Diese Datei nutzt bewusst Spaces.
#
# **Das ist kein eigenstaendiger Stack.** Dieser Block gehoert in
# `/home/paperless/paperless-ngx/docker-compose.yml`, wo auch paperless, traefik,
# HWYD und der Entwurf (deploy/jufi-entwurf.yml) wohnen -- ein Docker-Netz
# (paperless_default), ein Traefik. Die Datei hier ist die versionierte Fassung
# davon: was auf dem Server steht, soll hier nachvollziehbar sein. Eingefuegt wird
# einmalig von Hand; die Dienste unter `services:`, das Volume unter das
# vorhandene `volumes:`. tools/deploy.sh prueft nur, dass es da ist.
#
# Die Werte kommen aus der gemeinsamen `.env` neben der Compose-Datei, alle mit
# `JUFI_`-Praefix (Vorlage: deploy/env.jufi.example).
#
# Anwenden (immer nur JuFi-Dienste nennen, nie ein blankes `up -d`, sonst fasst
# Compose auch paperless an). Datenbank, Migration und Mailpit kommen ueber
# depends_on mit:
#   docker compose up -d jufi

services:
  # --- Datenbank -------------------------------------------------------------
  jufi-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JUFI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JUFI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${JUFI_POSTGRES_DB}
      # Gleiche Sortierung wie in der Entwicklung (docker-compose.dev.yml),
      # damit Abfrageergebnisse identisch sind.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    # Kein `ports:`. Von aussen nicht erreichbar, auch nicht ueber localhost.
    command:
      - postgres
      # Bewusst klein, Werte wie bei HWYD: paperless (rund 600 MB), MariaDB,
      # Redis und mehrere Apps teilen sich 3,7 GB, und **es gibt keinen Swap** --
      # eine Spitze heisst, der OOM-Killer sucht sich ein Opfer. Fuer die
      # Mitgliederlisten einiger Jugendgruppen sind 128 MB ueberreichlich.
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=25
      - -c
      - log_min_duration_statement=500
      # Langsame Abfragen ja, ihre Werte nein: Ohne diese Zeile schriebe Postgres die
      # Bind-Parameter mit ins Log, also Namen und E-Mail-Adressen (Spec 8.5).
      # Verworfen: log_min_duration_statement abschalten; dann fehlte der Hinweis auf
      # langsame Abfragen ganz.
      - -c
      - log_parameter_max_length=0
    # Harte Grenze, damit ein Ausrutscher hier nicht paperless umbringt.
    mem_limit: 384m
    volumes:
      - jufi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${JUFI_POSTGRES_USER} -d ${JUFI_POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- Migrationen: ein Durchlauf, dann fertig --------------------------------
  # Eigener Dienst, nicht im Entrypoint der App. Eine gescheiterte Migration im
  # Entrypoint erzeugt eine App in der Neustartschleife; hier ist sie ein
  # sichtbar gescheiterter Deploy, und die alte Version laeuft weiter.
  jufi-migrate:
    image: sideshowsystems/jufi:${JUFI_IMAGE_TAG:-latest}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    # Nur DATABASE_URL: mehr liest prisma.config.ts nicht. Anders als bei HWYD
    # stehen die Sitzungs- und TOTP-Geheimnisse hier nicht -- ein Dienst, der
    # ein Geheimnis nicht braucht, soll es auch nicht in `docker inspect` zeigen.
    environment:
      DATABASE_URL: postgresql://${JUFI_POSTGRES_USER}:${JUFI_POSTGRES_PASSWORD}@jufi-db:5432/${JUFI_POSTGRES_DB}?schema=public
    mem_limit: 256m
    depends_on:
      jufi-db:
        condition: service_healthy

  # --- Mail-Falle --------------------------------------------------------------
  # Auf der Testumgebung verlaesst keine Mail den Server: Mailpit faengt alles ab,
  # wie lokal. Testdaten enthalten erfundene Adressen, die zufaellig echt sein
  # koennen, und eine Einladung an eine fremde Person waere ein Datenschutzfall.
  #
  # **Keine Traefik-Route und kein oeffentlicher Port.** Die Mails enthalten
  # Einladungs- und Zuruecksetzen-Links im Klartext; wer die Oberflaeche sieht,
  # kann jeden Zugang uebernehmen. Die Oberflaeche ist deshalb nur an 127.0.0.1
  # des Servers gebunden und von aussen nur per SSH-Tunnel erreichbar:
  #
  #   ssh -L 8025:127.0.0.1:8025 <server>   dann im Browser http://127.0.0.1:8025
  #
  # SMTP (1025) ist gar nicht veroeffentlicht -- die App erreicht ihn ueber das
  # Docker-Netz unter dem Dienstnamen. Ohne Volume: die Mails sind nach einem
  # Neustart weg, und das ist fuer eine Mail-Falle richtig so.
  #
  # Echter Versand wird ueber JUFI_SMTP_* in der .env geschaltet; dieser Dienst
  # bleibt dann trotzdem stehen (die App haengt per depends_on an ihm) und
  # bleibt ungenutzt. MAIL_BETREFF_PRAEFIX bleibt fest '[Test] ', solange die
  # App in der Testumgebung (test.jufi-app.de) laeuft.
  jufi-mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - '127.0.0.1:8025:8025'
    labels:
      # Kein Router. Ausdruecklich aus statt nur ohne Labels: ob Traefik
      # unbeschriftete Container von selbst veroeffentlicht (exposedByDefault),
      # steht in der Traefik-Konfiguration und nicht hier -- diese Zeile haelt
      # unabhaengig davon dicht.
      - 'traefik.enable=false'

  # --- App -------------------------------------------------------------------
  jufi:
    image: sideshowsystems/jufi:${JUFI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${JUFI_POSTGRES_USER}:${JUFI_POSTGRES_PASSWORD}@jufi-db:5432/${JUFI_POSTGRES_DB}?schema=public
      SESSION_SECRET: ${JUFI_SESSION_SECRET}
      TOTP_ENC_KEY: ${JUFI_TOTP_ENC_KEY}
      # Hier liegen hochgeladene Dateien (Dokumente, ab Etappe 2 Fotos), siehe das
      # Volume unten. Pflicht: ohne den Wert startet die App nicht, statt Dateien
      # still in die beschreibbare Schicht des Containers zu schreiben, die mit
      # dem naechsten Ausrollen weg waere.
      DATEIEN_PFAD: /daten
      # Ursprung fuer die Origin-Pruefung schreibender Anfragen (server/ursprung.ts)
      # und fuer Links in Mails und aus der CLI. Reiner Ursprung, ohne Schraegstrich
      # am Ende -- sonst bricht die Startpruefung ab (libs/auth env-check).
      BASIS_URL: https://test.jufi-app.de
      # Passkeys. Hier ausdruecklich gesetzt und nicht aus dem Host-Header
      # abgeleitet: ein Schluessel haengt an dieser Domain, und das soll nicht von
      # einem Header abhaengen. Aendert sich die Domain, sind alle Passkeys
      # wertlos und muessen neu eingerichtet werden -- Passwort und TOTP bleiben.
      # Genau das ist der Preis des Umzugs von app-test auf test (Etappe 6,
      # Entscheidung 1): Passkeys, die unter app-test eingerichtet wurden, gelten
      # hier nicht mehr. Hingenommen, weil es nur Testkonten sind.
      WEBAUTHN_RP_ID: test.jufi-app.de
      WEBAUTHN_ORIGIN: https://test.jufi-app.de
      # Mail-Schalter: ohne Eintrag in der `.env` bleibt es bei der Mail-Falle.
      # `:-` greift auch bei einem **leeren** Wert -- `JUFI_SMTP_HOST=` aus der
      # Vorlage (deploy/env.jufi.example) bedeutet also Mailpit und kein
      # leerer Host. Verworfen: die Form ohne Doppelpunkt (`${X-...}`), denn die
      # nimmt eine leere, aber gesetzte Vorlagenzeile als Wert und bricht den Start.
      # `jufi-mailpit` bleibt unter depends_on, auch bei echtem Versand: so
      # reicht das Umschalten per .env, ohne den Block umzubauen.
      SMTP_HOST: ${JUFI_SMTP_HOST:-jufi-mailpit}
      SMTP_PORT: ${JUFI_SMTP_PORT:-1025}
      SMTP_USER: ${JUFI_SMTP_USER:-}
      SMTP_PASS: ${JUFI_SMTP_PASS:-}
      MAIL_ABSENDER: app@jufi-app.de
      MAIL_ANTWORT: kontakt@jufi-app.de
      # Damit eine Mail aus der Testumgebung nie wie eine echte aussieht.
      MAIL_BETREFF_PRAEFIX: '[Test] '
    depends_on:
      jufi-db:
        condition: service_healthy
      jufi-migrate:
        condition: service_completed_successfully
      # Nur gestartet, nicht gesund: Mailpit hat keinen Healthcheck, und der
      # Mail-Arbeiter versucht es im naechsten Takt erneut. Steht hier, damit
      # `up -d jufi` die Mail-Falle mitbringt und kein Dienst vergessen wird.
      jufi-mailpit:
        condition: service_started
    # Bemessen nach dem teuersten Foto, das die Upload-Route annimmt (TP4-Spec 2.4).
    # Die App allein braucht im Leerlauf rund 79 MiB (Rauchtest von tools/deploy.sh).
    # Die Fotoverarbeitung laeuft immer nur einmal zur Zeit (FotoSchlange, auch das
    # Vereinslogo), braucht aber je nach Kodierung sehr verschieden viel: Ein
    # progressives JPEG haelt alle Koeffizienten, ein Adam7-PNG wird ganz entpackt.
    # Gemessen am 22.10.2026 (sharp 0.35, Probe allein im Image, cgroup-Spitze):
    # 48-MP-JPEG 79 MiB, 20-MB-PNG 86 MiB, 48-MP-WebP 96 MiB, progressives
    # 48-MP-JPEG 4:2:0 218 MiB, Adam7-PNG mit 50 MP 282 MiB, progressives
    # 48-MP-JPEG 4:4:4 356 MiB, alle nacheinander in einem Prozess 362 MiB.
    # Mit 256m beendete der Kernel die Probe schon am 4:4:4-JPEG. Bedarf im
    # Rauchtest (App im Leerlauf plus Probe) rund 441 MiB, plus rund 25 % Reserve
    # fuer argon2 beim Anmelden (19 MB je Hash, libs/auth passwords.ts) und
    # gleichzeitige Anfragen, aufgerundet auf 64m: 576m.
    # Verworfen: die Fotoverarbeitung in einen Kindprozess auslagern -- er liefe
    # in derselben cgroup, braeuchte also dieselbe Grenze plus eine zweite
    # Node-Laufzeit, und machte nur die Folgen eines Abbruchs kleiner, nicht den
    # Bedarf;
    # verworfen: eine Pixelgrenze je Kodierung (z. B. 24 MP fuer progressive
    # JPEGs) -- sie wiese Fotos ab, die Handys so liefern, und die Spec waehlt
    # ausdruecklich das Anheben der Grenze statt einer kleineren Fotogrenze.
    # Die VM teilt sich 3,7 GB ohne Swap; ueber 768m geht es nicht ohne
    # Ruecksprache mit dem Eigentuemer.
    mem_limit: 576m
    volumes:
      - jufi-dateien:/daten
    # Wie im Image (Dockerfile), hier noch einmal, damit der Block fuer sich lesbar
    # ist: Node **und** Datenbank, und in der Startphase jede Sekunde, weil
    # Traefik den Dienst erst bei healthy aufnimmt.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Kein `ports:`. Erreichbar nur ueber Traefik.
    labels:
      - 'traefik.enable=true'
      # Die App liegt auf der Wurzel von test.jufi-app.de; der Entwurf teilt sich
      # die Domain unter /entwurf (jufi-entwurf.yml). Die Reihenfolge entscheidet
      # Traefik nach Regellaenge, und die PathPrefix-Regel des Entwurfs ist
      # laenger -- sie gewinnt, die App bekommt alles uebrige (Entscheidung 9).
      - 'traefik.http.routers.jufi.rule=Host(`test.jufi-app.de`)'
      # Traefik terminiert TLS selbst per Let's Encrypt, wie bei HWYD und dem
      # Entwurf. Deshalb **kein** Middleware-Label, das X-Forwarded-Proto setzt:
      # Traefik setzt den Header von sich aus richtig, weil es das TLS-Ende ist,
      # und die App vertraut genau einem Proxy (trust proxy 1, server/app.ts).
      - 'traefik.http.routers.jufi.entrypoints=websecure'
      - 'traefik.http.routers.jufi.tls.certresolver=letsencrypt'
      - 'traefik.http.services.jufi.loadbalancer.server.port=4000'
      # Express komprimiert nicht von selbst, und Traefik macht es billiger als
      # Node -- und fuer alle Dienste gleich.
      - 'traefik.http.middlewares.jufi-compress.compress=true'
      - 'traefik.http.routers.jufi.middlewares=jufi-compress'
      # Alte Adresse: nur noch Umleitung, Pfad und Abfrage bleiben erhalten, damit
      # verschickte Einladungs- und Zuruecksetzen-Links weiter fuehren. Passkeys
      # lassen sich nicht mitnehmen (siehe WEBAUTHN_RP_ID). Verworfen: beide
      # Domains parallel bedienen -- eine Sitzung und ein Passkey haengen je an
      # einer Domain, die Mitglieder haetten zwei Staende. Die Umleitung entfaellt,
      # sobald app-test aus dem DNS genommen wird.
      - 'traefik.http.routers.jufi-alt.rule=Host(`app-test.jufi-app.de`)'
      - 'traefik.http.routers.jufi-alt.entrypoints=websecure'
      - 'traefik.http.routers.jufi-alt.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.jufi-alt.service=jufi'
      - 'traefik.http.middlewares.jufi-umzug.redirectregex.regex=^https://app-test\.jufi-app\.de/(.*)'
      - 'traefik.http.middlewares.jufi-umzug.redirectregex.replacement=https://test.jufi-app.de/$${1}'
      - 'traefik.http.middlewares.jufi-umzug.redirectregex.permanent=true'
      - 'traefik.http.routers.jufi-alt.middlewares=jufi-umzug'

volumes:
  # Die Mitgliederdaten. Gesichert wird taeglich um 03:40 per restic ausser Haus
  # (tools/backup.sh, eingerichtet mit tools/install-backup.sh, README Sicherung).
  jufi-pgdata:
  # Die hochgeladenen Dateien. Die Datenbank kennt nur ihre Zeilen (Name, Typ,
  # Pruefsumme); ohne dieses Volume waeren die Bytes nach einer Wiederherstellung
  # weg. Gesichert wird es im selben Lauf wie der Dump (tools/backup.sh, Tag
  # jufi-dateien).
  #
  # **Fester Name** statt des von Compose aus dem Projektnamen gebildeten
  # (<projekt>_jufi-dateien): backup.sh findet das Volume mit
  # `docker volume inspect jufi-dateien` und soll den Projektnamen der
  # gemeinsamen Compose-Datei nicht kennen muessen. Verworfen: ein Bind-Mount auf
  # einen Pfad neben der Compose-Datei -- das Volume bekommt beim ersten
  # Einhaengen den Besitzer node aus dem Image (Dockerfile), ein Bind-Mount
  # gehoerte root und die App koennte nicht schreiben.
  jufi-dateien:
    name: jufi-dateien
