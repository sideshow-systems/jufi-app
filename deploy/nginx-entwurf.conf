# nginx fuer den klickbaren Entwurf (Spec TP1 8.3).
#
# add_header vererbt sich nicht in Bloecke, die selbst add_header setzen. Die
# Sicherheits-Header (sicherheit.conf) stehen deshalb in jedem location-Block,
# der Cache-Header setzt; sonst fehlten sie genau bei index.html und den Buendeln.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Hinter Traefik spricht nginx nur http. Absolute Weiterleitungen zeigten
	# deshalb auf http:// und kippten die Testperson aus TLS; relative nicht.
	absolute_redirect off;
	server_tokens off;

	include /etc/nginx/sicherheit.conf;

	# Bis Teilprojekt 2 gehoert die Domain dem Entwurf.
	location = / {
		return 302 /entwurf/;
	}

	# Angular haengt einen Hash an Skripte und Stile (main-ABCD1234.js): ewig cachen.
	# In Anfuehrungszeichen, sonst liest nginx die geschweiften Klammern als Blockgrenze.
	location ~ "^/entwurf/.+-[A-Z0-9]{8}\.(js|css)$" {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/sicherheit.conf;
		try_files $uri =404;
	}

	# Immer frisch, damit ein neuer Stand sofort ankommt.
	location = /entwurf/index.html {
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/sicherheit.conf;
	}

	# Tiefe Links (/entwurf/glonntal/t/2-bowling) bekommen die index.html; die
	# Routen loest Angular im Browser auf.
	location /entwurf/ {
		try_files $uri $uri/ /entwurf/index.html;
	}
}
